# Netlify build config for the Next.js app.
# @netlify/plugin-nextjs needs the publish directory pointed at the Next.js
# build output (.next); it then wires SSR/dynamic routes as functions.

[build]
  command = "npm run build"
  publish = ".next"

[build.environment]
  NODE_VERSION = "20"

[[plugins]]
  package = "@netlify/plugin-nextjs"
